<div class="h-screen flex items-center justify-center bg-dentalGreen">
  <div class="bg-white shadow-lg rounded-lg w-full max-w-md p-4 sm:p-6">
    <div class="text-center mb-4">
      <img src="../../../../assets/dental_logo.webp" alt="Dental Logo" class="mx-auto w-16 h-16 rounded-full">
      <h1 class="text-xl font-bold text-blue-600 mt-2">Create Your Account</h1>
      <p class="text-gray-600 text-sm">Join Smile Dental Care today!</p>
    </div>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email"
          placeholder="yourname@example.com" 
          class="w-full px-3 py-1.5 border rounded-lg focus:ring-blue-500 focus:border-blue-500"
          [ngClass]="{'border-red-500': signupForm.get('email')?.invalid && signupForm.get('email')?.touched}"
        />
        <p class="text-red-500 text-xs mt-0.5" *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched">
          {{ getErrorMessage('email') }}
        </p>
      </div>

      <div class="relative">
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input 
          id="password" 
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="Create a strong password" 
          class="w-full px-3 py-1.5 border rounded-lg focus:ring-blue-500 focus:border-blue-500 pr-10"
          [ngClass]="{'border-red-500': signupForm.get('password')?.invalid && signupForm.get('password')?.touched}"
        />
        <span 
          class="absolute inset-y-0 right-2 flex items-center cursor-pointer text-gray-600 mt-4"
          (click)="togglePassword()">
          {{ showPassword ? '🙈' : '👁️' }}
        </span>
        <p class="text-red-500 text-xs mt-0.5" *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched">
          {{ getErrorMessage('password') }}
        </p>
      </div>

      <p class="text-red-500 text-sm text-center" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <div>
        <button 
          type="submit" 
          class="w-full bg-dentalGreen text-black font-medium py-1.5 px-4 rounded-lg hover:bg-opacity-80 transition"
          [disabled]="signupForm.invalid || isSubmitting">
          {{ isSubmitting ? 'Creating account...' : 'Sign Up' }}
        </button>
      </div>

      <div class="text-center mt-2">
        <a [routerLink]="['/auth/login']" class="text-blue-600 hover:underline text-sm">
          Already have an account? Login
        </a>
      </div>
    </form>
  </div>
</div>
