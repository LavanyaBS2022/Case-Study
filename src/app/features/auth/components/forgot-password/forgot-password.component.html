<div class="min-h-screen flex items-center justify-center bg-dentalGreen">
    <div class="bg-white shadow-lg rounded-lg w-full max-w-md p-4 sm:p-6">
      <!-- Reduced padding and made logo smaller -->
      <div class="text-center mb-4">
        <img src="../../../../assets/dental_logo.webp" alt="Dental Logo" class="mx-auto w-16 h-16 rounded-full">
        <h1 class="text-xl font-bold text-blue-600 mt-2">Reset Password</h1>
        <p class="text-gray-600 text-sm">Enter your email to reset your password</p>
      </div>
  
      <!-- Reduced space between form elements -->
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
          <input 
            id="email" 
            type="email" 
            formControlName="email"
            placeholder="yourname@example.com" 
            class="w-full px-3 py-1.5 border rounded-lg focus:ring-blue-500 focus:border-blue-500"
            [ngClass]="{'border-red-500': forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched}"
          />
          <p class="text-red-500 text-xs mt-0.5" *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched">
            {{ getErrorMessage('email') }}
          </p>
        </div>
  
        <p class="text-red-500 text-sm text-center" *ngIf="errorMessage">
          {{ errorMessage }}
        </p>
  
        <p class="text-green-500 text-sm text-center" *ngIf="successMessage">
          {{ successMessage }}
        </p>
  
        <div>
          <button 
            type="submit" 
            class="w-full bg-dentalGreen text-black font-medium py-1.5 px-4 rounded-lg hover:bg-opacity-80 transition"
            [disabled]="forgotPasswordForm.invalid || isSubmitting">
            {{ isSubmitting ? 'Sending reset link...' : 'Send Reset Link' }}
          </button>
        </div>
  
        <!-- Reduced margin for back to login link -->
        <div class="text-center mt-2">
          <a [routerLink]="['/auth/login']" class="text-blue-600 hover:underline text-sm">
            Back to Login
          </a>
        </div>
      </form>
    </div>
  </div>
